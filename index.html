<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extended ACES Trauma Impact Assessment</title>
  <style>
    :root{
      --bg: #0b0f1a;
      --card-bg: rgba(10, 12, 18, 0.72);
      --card-border: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);
      --btn: rgba(255,255,255,0.10);
      --btn-hover: rgba(255,255,255,0.16);
      --focus: rgba(255,255,255,0.25);
    }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 10% 10%, rgba(120,160,255,0.18), transparent 60%),
                  radial-gradient(900px 700px at 90% 20%, rgba(255,140,200,0.12), transparent 55%),
                  var(--bg);
      color: var(--text);
    }
    a{ color: inherit; }
    .wrap{ max-width: 900px; margin: 0 auto; padding: 18px; }
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding: 10px 0 16px;
    }
    .brand{ font-weight: 700; letter-spacing: 0.2px; }
    .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .btn{
      border: 1px solid var(--card-border);
      background: var(--btn);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 120ms ease;
      font-weight: 600;
    }
    .btn:hover{ background: var(--btn-hover); }
    .btn:focus{ outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn.primary{ background: rgba(120,160,255,0.22); }
    .btn.primary:hover{ background: rgba(120,160,255,0.28); }
    .btn.secondary{ background: rgba(255,255,255,0.08); }

    .card{
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .h1{ font-size: 22px; margin: 0; }
    .muted{ color: var(--muted); }
    .p{ line-height: 1.45; margin: 12px 0; }
    .hr{ height:1px; background: var(--card-border); margin: 14px 0; }
    .pill{
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px){ .grid2{ grid-template-columns: 1fr; } }

    .callout{
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,0.06);
    }
    .callout.warning{ background: rgba(255,160,90,0.12); }
    .callout.info{ background: rgba(120,160,255,0.12); }

    .checklist{ display:flex; flex-direction:column; gap: 10px; }
    .chk{ display:flex; gap: 10px; align-items:flex-start; }
    .chk input{ margin-top: 4px; transform: scale(1.15); }
    .small{ font-size: 13px; color: var(--muted); }

    /* Modals */
    .backdrop{
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display:flex; align-items:center; justify-content:center;
      padding: 18px;
      z-index: 10;
    }
    .hidden{ display:none !important; }
    .modal{
      width: min(720px, 100%);
      border: 1px solid var(--card-border);
      background: rgba(12, 14, 22, 0.94);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    }
    .modal h2{ margin:0; font-size: 18px; }
    .modal .actions{ display:flex; gap: 10px; justify-content:flex-end; flex-wrap:wrap; margin-top: 12px; }
    label.inline{ display:flex; gap:10px; align-items:flex-start; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Extended ACES — Prototype</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn secondary" id="btnHome" type="button">Home</button>
        <button class="btn secondary" id="btnRestart" type="button">Restart</button>
      </div>
    </div>

    <main id="routeView"></main>
  </div>

  <!-- Disclaimer Modal -->
  <div class="backdrop hidden" id="disclaimerBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="discTitle">
      <h2 id="discTitle">Disclaimer</h2>
      <p class="p muted">
        This tool is a conceptual framework for structured reflection. It is not a diagnostic instrument or medical advice.
      </p>
      <div class="hr"></div>
      <label class="inline">
        <input type="checkbox" id="disclaimerAgree" />
        <span class="small">I have read this information and agree to continue.</span>
      </label>
      <div class="actions">
        <button class="btn secondary" id="disclaimerDecline" type="button">Decline</button>
        <button class="btn primary" id="disclaimerAccept" type="button" disabled>Accept</button>
      </div>
    </div>
  </div>

  <!-- Uncheck Modal -->
  <div class="backdrop hidden" id="uncheckBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="uncheckTitle">
      <h2 id="uncheckTitle">Confirm removal</h2>
      <p class="p muted" id="uncheckDetail"></p>
      <div class="callout warning">
        Categories 1–5 are recommended for most people due to nuance. If you’re sure it does not apply, you can remove it.
      </div>
      <div class="actions">
        <button class="btn secondary" id="uncheckKeep" type="button">Keep selected</button>
        <button class="btn primary" id="uncheckRemove" type="button">Remove</button>
      </div>
    </div>
  </div>
<script>
/* =========================
   One-page ACES prototype
   - No routes
   - Single index.html
   - localStorage for "disclaimer accepted" + category selections
   ========================= */

const STORAGE_KEY = "aces_onepage_v01";

const CATEGORIES = [
  { id: "cat1", n: 1, title: "Emotional / psychological abuse", note: "Verbal aggression, humiliation, threats, gaslighting, coercive control, scapegoating, autonomy suppression." },
  { id: "cat2", n: 2, title: "Sexual abuse", note: "Unwanted sexual contact, coercion, exploitation, or exposure during childhood." },
  { id: "cat3", n: 3, title: "Emotional neglect", note: "Chronic lack of emotional safety, attunement, protection, or care." },
  { id: "cat4", n: 4, title: "Physical abuse", note: "Physical harm or threats of harm from a caregiver or household adult." },
  { id: "cat5", n: 5, title: "Peer bullying", note: "Chronic peer aggression: humiliation, exclusion, threats, harassment, or assault from peers." },
  { id: "cat6", n: 6, title: "Physical neglect", note: "Insufficient basic needs: food, supervision, hygiene, medical care, safety." },
  { id: "cat7", n: 7, title: "Domestic violence exposure", note: "Witnessing violence, coercive control, or credible threats between adults." },
  { id: "cat8", n: 8, title: "Loss / abandonment / incarceration", note: "Separation, abandonment, caregiver incarceration, or chronic fear of loss during childhood." },
  { id: "cat9", n: 9, title: "Caregiver mental illness / suicidality", note: "Household caregiver mental illness, severe instability, or suicidal behaviors." },
  { id: "cat10", n: 10, title: "Caregiver substance misuse", note: "Alcohol or drug misuse creating instability, danger, or chronic stress." },
];

const SUBCATEGORIES = {
  cat1: [
    { id: "cat1_sub1A", title: "1A: Verbal aggression", blurb: "Harsh tone, yelling, verbal hostility; escalation from dysregulated snapping to chronic verbal attack." },
    { id: "cat1_sub1B", title: "1B: Shame-based abuse (degrading / humiliating)", blurb: "Mocking, ridicule, contempt, public humiliation, identity-shaming." },
    { id: "cat1_sub1C", title: "1C: Terrorizing / threat-based control", blurb: "Fear conditioning via threats, intimidation, unpredictable rage, abandonment threats, or credible harm threats." },
    { id: "cat1_sub1D", title: "1D: Exploitation / corruption", blurb: "Recruiting the child into adult agendas: loyalty coercion, secrecy, lying, moral pressure, instrumentalization." },
    { id: "cat1_sub1E", title: "1E: Role reversal / emotional parentification", blurb: "Child becomes stabilizer/therapist/partner-like emotional support; adult leans on child instead of holding upward." },
    { id: "cat1_sub1F", title: "1F: Isolation", blurb: "Restricting/sabotaging outside relationships to enforce dependency; undermining support access." },
    { id: "cat1_sub1G", title: "1G: Gaslighting / cognitive manipulation", blurb: "Systematic distortion of reality/emotions/memory; blame reversal; chronic self-doubt and confusion." },
    { id: "cat1_sub1H", title: "1H: Excessive control / intrusion", blurb: "Chronic over-control and privacy invasion that suppresses age-appropriate autonomy and agency." },
    { id: "cat1_sub1I", title: "1I: Rejection / scapegoating", blurb: "Patterned positioning as unwanted/defective/the problem; identity-structural rejection." },
    { id: "cat1_sub1J", title: "1J: Chronic conditional belonging", blurb: "Love, safety, or approval consistently tied to performance, loyalty, silence, or compliance in ways that shaped identity and self-worth." },
  ],

  cat2: [
    { id: "cat2_subA", title: "2A: Direct physical sexual contact", blurb: "Physical sexual contact directed toward the child or requiring participation, including falsely framed 'medical' contact." },
    { id: "cat2_subB", title: "2B: Directed sexual behavior without direct contact", blurb: "Exposure to sexual material or direction to engage in sexualized behavior without direct physical assault." },
    { id: "cat2_subC", title: "2C: Emotional incest / sexualized boundary violations", blurb: "Role reversal, romanticized framing, identity shaping, or sexualized relational dynamics without direct physical contact." },
    { id: "cat2_subD", title: "2D: Privacy and bodily autonomy violations", blurb: "Coercive or humiliating intrusion into bodily privacy exceeding developmentally appropriate caregiving." },
    { id: "cat2_subE", title: "2E: Image / recording-based exploitation", blurb: "Sexualized staging, image sharing, appearance regulation, or body-based identity exploitation." }
  ],

  cat3: [
    { id: "cat3_sub1", title: "Lack of emotional attunement", blurb: "No comfort, no protection, chronic emotional unavailability." },
    { id: "cat3_sub2", title: "Lack of protection / advocacy", blurb: "Caregivers fail to protect, notice, or intervene when child is harmed." },
  ],

  cat4: [
    { id: "cat4_sub1", title: "Direct physical harm", blurb: "Hitting, choking, burning, throwing objects, etc." },
    { id: "cat4_sub2", title: "Threats or credible fear", blurb: "Fear of harm used as control, even if injuries were not frequent." },
  ],

  cat5: [
    { id: "cat5_sub1", title: "Relational / social bullying", blurb: "Exclusion, rumor-spreading, humiliation, coercive group dynamics." },
    { id: "cat5_sub2", title: "Harassment / threats / violence", blurb: "Threats, stalking, intimidation, harassment, assault, or repeated targeting." },
  ],

  cat6: [
    { id: "cat6_sub1", title: "Basic needs unmet", blurb: "Food, hygiene, clothing, safe sleep, supervision." },
    { id: "cat6_sub2", title: "Medical neglect", blurb: "Chronic refusal or failure to seek needed care." },
  ],

  cat7: [
    { id: "cat7_sub1", title: "Witnessing violence", blurb: "Seeing or hearing physical violence or credible threats." },
    { id: "cat7_sub2", title: "Coercive control environment", blurb: "Atmosphere of fear, stalking, surveillance, control between adults." },
  ],

  cat8: [
    { id: "cat8_sub1", title: "Loss / separation / abandonment", blurb: "Caregiver leaves, disappears, repeated threats of leaving, or chronic fear of loss." },
    { id: "cat8_sub2", title: "Caregiver incarceration impact", blurb: "Incarceration or repeated police involvement causing instability and loss." },
  ],

  cat9: [
    { id: "cat9_sub1", title: "Severe mental illness environment", blurb: "Severe symptoms that impacted safety and stability." },
    { id: "cat9_sub2", title: "Suicidality in household", blurb: "Attempts, threats, self-harm, crisis episodes." },
  ],

  cat10: [
    { id: "cat10_sub1", title: "Alcohol misuse environment", blurb: "Instability, danger, neglect linked to alcohol use." },
    { id: "cat10_sub2", title: "Drug misuse environment", blurb: "Instability, danger, neglect linked to drug use." },
  ],
};

function defaultState(){
  return {
    disclaimerAccepted: false,
    selectedCategories: Object.fromEntries(CATEGORIES.map(c => [c.id, true])),
    selectedSubs: {}, // subcategory checkbox state
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return {
      ...base,
      ...parsed,
      selectedCategories: { ...base.selectedCategories, ...(parsed.selectedCategories || {}) },
      selectedSubs: { ...(base.selectedSubs || {}), ...(parsed.selectedSubs || {}) },
    };
  }catch{
    return defaultState();
  }
}

function saveState(patch){
  const current = loadState();
  const next = { ...current, ...patch };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  return next;
}

function hardReset(){
  localStorage.removeItem(STORAGE_KEY);
}

/* --------- Elements --------- */
const el = {
  routeView: document.getElementById("routeView"),
  btnHome: document.getElementById("btnHome"),
  btnRestart: document.getElementById("btnRestart"),

  disclaimerBackdrop: document.getElementById("disclaimerBackdrop"),
  disclaimerAgree: document.getElementById("disclaimerAgree"),
  disclaimerAccept: document.getElementById("disclaimerAccept"),
  disclaimerDecline: document.getElementById("disclaimerDecline"),

  uncheckBackdrop: document.getElementById("uncheckBackdrop"),
  uncheckDetail: document.getElementById("uncheckDetail"),
  uncheckKeep: document.getElementById("uncheckKeep"),
  uncheckRemove: document.getElementById("uncheckRemove"),
};

let pendingUncheck = null; // { catId, checkboxEl }

/* --------- UI: main one-page render --------- */
function renderMain(){
  const st = loadState();

  const checklistHtml = CATEGORIES.map(cat => {
    const checked = st.selectedCategories[cat.id] ? "checked" : "";
    const subs = SUBCATEGORIES[cat.id] || [];
    const subsHtml = subs.map(s => `
      <label class="chk" style="padding-left: 18px;">
        <input type="checkbox" data-sub="${s.id}" ${st.selectedSubs?.[s.id] ? "checked" : ""} />
        <span>
          <span class="small"><b>${s.title}</b> — ${s.blurb}</span>
        </span>
      </label>
    `).join("");

    return `
      <div class="callout" style="padding: 12px;">
        <label class="chk" style="margin:0;">
          <input type="checkbox" data-cat="${cat.id}" ${checked} />
          <span>
            <b>${cat.n}. ${cat.title}</b><br/>
            <span class="small">${cat.note}</span>
          </span>
        </label>

        <details style="margin-top:10px;">
          <summary class="small" style="cursor:pointer;">Show subcategories</summary>
          <div class="checklist" style="margin-top:10px;">
            ${subsHtml || `<div class="small muted">No subcategories defined yet.</div>`}
          </div>
        </details>
      </div>
    `;
  }).join("");

  el.routeView.innerHTML = `
    <section class="card">
      <div class="row">
        <div>
          <h1 class="h1">Extended ACES — Prototype</h1>
          <div class="muted">Simple one-page outline (no routes)</div>
        </div>
        <span class="pill">Local-only</span>
      </div>

      <div class="hr"></div>

      <p class="p">
        This is a structured outline of categories and notes.
        Later, each category can expand into subcategories and item lists — but for now we’re keeping it intentionally simple.
      </p>

      <div class="grid2">
        <div class="callout info">
          <b>How to use:</b><br/>
          Leave checked anything that might apply. Uncheck only what you are sure does not apply.
        </div>
        <div class="callout warning">
          <b>Note:</b><br/>
          If you uncheck categories 1–5, you’ll be asked to confirm removal (because these often contain nuance).
        </div>
      </div>

      <div class="hr"></div>

      <div class="checklist" id="catList">
        ${checklistHtml}
      </div>

      <div class="hr"></div>

      <div class="callout info">
        <b>Next step (later):</b> This is where we’ll add subcategory expand/collapse panels, then the 10–20 Likert items.
      </div>
    </section>
  `;

  // Wire category checkbox behavior
  document.querySelectorAll('input[type="checkbox"][data-cat]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const catId = e.target.getAttribute("data-cat");
      const cat = CATEGORIES.find(c => c.id === catId);
      const isChecked = e.target.checked;

      // Checking it back on: save immediately
      if(isChecked){
        const st2 = loadState();
        const nextSel = { ...st2.selectedCategories, [catId]: true };
        saveState({ selectedCategories: nextSel });
        return;
      }

      // Unchecking categories 1–5 -> confirm modal
      if(cat.n >= 1 && cat.n <= 5){
        e.target.checked = true; // revert until confirmed
        pendingUncheck = { catId, checkboxEl: e.target };
        showUncheckModal(cat);
        return;
      }

      // Unchecking 6–10 -> save immediately
      const st2 = loadState();
      const nextSel = { ...st2.selectedCategories, [catId]: false };
      saveState({ selectedCategories: nextSel });
    });
  });

    // Wire subcategory checkbox behavior (simple save)
  document.querySelectorAll('input[type="checkbox"][data-sub]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const subId = e.target.getAttribute("data-sub");
      const isChecked = e.target.checked;
      const st2 = loadState();
      const nextSubs = { ...(st2.selectedSubs || {}), [subId]: isChecked };
      saveState({ selectedSubs: nextSubs });
    });
  });
}

/* --------- Disclaimer modal --------- */
function showDisclaimerIfNeeded(){
  const st = loadState();
  if(st.disclaimerAccepted) return;

  el.disclaimerBackdrop.classList.remove("hidden");
  el.disclaimerBackdrop.setAttribute("aria-hidden", "false");
  el.disclaimerAgree.checked = false;
  el.disclaimerAccept.disabled = true;
}

function hideDisclaimer(){
  el.disclaimerBackdrop.classList.add("hidden");
  el.disclaimerBackdrop.setAttribute("aria-hidden", "true");
}

/* --------- Uncheck confirm modal --------- */
function showUncheckModal(cat){
  el.uncheckDetail.textContent = `Category ${cat.n}: ${cat.title}`;
  el.uncheckBackdrop.classList.remove("hidden");
  el.uncheckBackdrop.setAttribute("aria-hidden", "false");
}

function hideUncheckModal(){
  el.uncheckBackdrop.classList.add("hidden");
  el.uncheckBackdrop.setAttribute("aria-hidden", "true");
  pendingUncheck = null;
}

/* --------- Top buttons --------- */
el.btnHome.addEventListener("click", () => {
  // On a one-page app, "Home" just re-renders.
  renderMain();
});

el.btnRestart.addEventListener("click", () => {
  const ok = confirm("This will clear local selections and restart. Continue?");
  if(!ok) return;
  hardReset();
  renderMain();
  showDisclaimerIfNeeded();
});

/* --------- Disclaimer wiring --------- */
el.disclaimerAgree.addEventListener("change", () => {
  el.disclaimerAccept.disabled = !el.disclaimerAgree.checked;
});

el.disclaimerAccept.addEventListener("click", () => {
  saveState({ disclaimerAccepted: true });
  hideDisclaimer();
});

el.disclaimerDecline.addEventListener("click", () => {
  // Minimal exit: show a simple card
  el.routeView.innerHTML = `
    <section class="card">
      <h1 class="h1">Exit</h1>
      <p class="p muted">You chose not to continue. You can close this tab.</p>
    </section>
  `;
});

/* --------- Uncheck modal wiring --------- */
el.uncheckKeep.addEventListener("click", () => {
  if(pendingUncheck){
    const st = loadState();
    const nextSel = { ...st.selectedCategories, [pendingUncheck.catId]: true };
    saveState({ selectedCategories: nextSel });
    if(pendingUncheck.checkboxEl) pendingUncheck.checkboxEl.checked = true;
  }
  hideUncheckModal();
});

el.uncheckRemove.addEventListener("click", () => {
  if(pendingUncheck){
    const st = loadState();
    const nextSel = { ...st.selectedCategories, [pendingUncheck.catId]: false };
    saveState({ selectedCategories: nextSel });
    if(pendingUncheck.checkboxEl) pendingUncheck.checkboxEl.checked = false;
  }
  hideUncheckModal();
});

/* --------- Init --------- */
window.addEventListener("DOMContentLoaded", () => {
  renderMain();
  showDisclaimerIfNeeded();
});
</script>
</body>
</html>
